services:
  - type: web
    name: lavalink-server
    env: docker
    plan: free
    region: singapore  # Choose closest region
    
    # Docker configuration
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    
    # Health check
    healthCheckPath: /version
    
    # Environment variables
    envVars:
      - key: LAVALINK_PASSWORD
        value: your_super_strong_password_here
      - key: PORT
        value: 2333
      - key: JAVA_OPTS
        value: "-Xmx350M -Xms128M -XX:+UseSerialGC"
      - key: TZ
        value: Asia/Jakarta
    
    # Auto deploy from GitHub
    autoDeploy: true
    
    # Scaling (free tier = 1 instance)
    numInstances: 1
