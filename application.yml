server:
  port: ${PORT:-2333}
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.16.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    password: ${LAVALINK_PASSWORD:your_super_strong_password_here}
    
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    
    bufferDurationMs: 400
    frameBufferDurationMs: 2000
    youtubePlaylistLoadLimit: 5
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    trackStuckThresholdMs: 10000
    useSeekGhosting: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    
    # TRY ALL AVAILABLE CLIENTS untuk fix playback
    clients:
      - MUSIC                            # YouTube Music - paling stabil
      - ANDROID_MUSIC                    # Android YouTube Music
      - ANDROID_VR                       # Android VR client
      - WEB                              # Web client
      - MWEB                             # Mobile Web
      - TVHTML5_SIMPLY_EMBEDDED_PLAYER   # TV Embedded
      - IOS                              # iOS client
      - ANDROID                          # Android app
    
    # IMPORTANT: Disable signature scraping issues
    signatureCipher:
      disableOnError: true              # Akan skip ke client lain jika error
    
    # POToken untuk bypass bot detection (EXPERIMENTAL)
    # Uncomment jika masih bermasalah
    # pot:
    #   enabled: true
    
    # OAuth untuk bypass rate limit (OPTIONAL)
    oauth:
      enabled: false
      # Jika mau enable, generate refresh token dari:
      # https://github.com/lavalink-devs/youtube-source#oauth-integration
      # refreshToken: ""

  lavasrc:
    providers:
      - "ytsearch:%QUERY%"
      - "ytsearch:\"%ISRC%\""
    
    sources:
      spotify: true
      applemusic: true
      deezer: false
      yandexmusic: false
      flowerytts: false
      vkmusic: false
    
    spotify:
      countryCode: "ID"
      playlistLoadLimit: 5
      albumLoadLimit: 5
    
    applemusic:
      countryCode: "ID"
      mediaAPIToken: ""
      playlistLoadLimit: 5
      albumLoadLimit: 5

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: DEBUG
