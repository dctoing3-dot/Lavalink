server:
  port: ${PORT:-2333}
  address: 0.0.0.0

# ============================================
# LAVALINK PLUGINS - VERSI TERBARU FEB 2026
# ============================================
lavalink:
  plugins:
    # YouTube Plugin - TERBARU v1.16.0
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.16.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    
    # LavaSrc Plugin - TERBARU v4.8.0
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    password: ${LAVALINK_PASSWORD:your_super_strong_password_here}
    sources:
      # Built-in sources
      youtube: false        # HARUS false, pakai plugin!
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    
    # Optimization untuk Render free tier
    bufferDurationMs: 400
    frameBufferDurationMs: 2000
    youtubePlaylistLoadLimit: 5
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    
    # Rate limit config
    ratelimit:
      ipBlocks: []
      excludedIps: []
      strategy: "RotateOnBan"
      searchTriggersFail: true
      retryLimit: 3

# ============================================
# PLUGIN CONFIGURATIONS - UPDATED
# ============================================
plugins:
  # YouTube Plugin Configuration
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    
    # Clients untuk fallback (IMPROVED di v1.16.0)
    clients:
      - MUSIC           # YouTube Music (recommended)
      - WEB             # YouTube Web
      - ANDROID_TESTSUITE  # Android client
      - TVHTML5EMBEDDED    # TV client
    
    # OAuth untuk menghindari rate limit (opsional)
    oauth:
      enabled: false
      # refreshToken: ""
      # skipInitialization: false
  
  # LavaSrc Configuration - UPDATED v4.8.0
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""   # Cari via ISRC code
      - "ytsearch:%QUERY%"      # Fallback ke YouTube search
    
    sources:
      spotify: true
      applemusic: true
      deezer: true
      yandexmusic: false
      flowerytts: false
      vkmusic: false
    
    # Spotify Configuration (Tanpa credentials untuk basic)
    spotify:
      countryCode: "ID"
      playlistLoadLimit: 5
      albumLoadLimit: 5
      # clientId: ""       # Opsional
      # clientSecret: ""   # Opsional
      # localFiles: false  # NEW in v4.8.0
    
    # Deezer Configuration
    deezer:
      countryCode: "ID"
      # masterDecryptionKey: ""  # Opsional untuk HQ
    
    # Apple Music Configuration
    applemusic:
      countryCode: "ID"
      mediaAPIToken: ""
      playlistLoadLimit: 5
      albumLoadLimit: 5
    
    # YouTube Search (NEW in LavaSrc v4.8.0)
    youtube:
      countryCode: "ID"
      language: "id"

# ============================================
# METRICS & MONITORING
# ============================================
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

# ============================================
# SENTRY
# ============================================
sentry:
  dsn: ""
  environment: "production"

# ============================================
# LOGGING
# ============================================
logging:
  level:
    root: INFO
    lavalink: INFO
    
  file:
    path: ./logs/
    max-size: 10MB
    max-history: 3

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 3
      total-size-cap: 30MB
