server:
  port: ${PORT:-2333}
  address: 0.0.0.0

# ============================================
# PLUGINS - CRITICAL FOR SEARCH
# ============================================
lavalink:
  plugins:
    # YouTube Plugin - REQUIRED for search
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.16.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    
    # LavaSrc Plugin
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    password: ${LAVALINK_PASSWORD:your_super_strong_password_here}
    
    sources:
      youtube: false        # MUST BE FALSE!
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    
    # CRITICAL FOR SEARCH - MUST BE TRUE!
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    
    # Performance settings
    bufferDurationMs: 400
    frameBufferDurationMs: 2000
    youtubePlaylistLoadLimit: 5
    playerUpdateInterval: 5
    gc-warnings: true
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    
    # No rate limit for search
    ratelimit:
      ipBlocks: []
      excludedIps: []
      strategy: "RotateOnBan"
      searchTriggersFail: false    # IMPORTANT: false
      retryLimit: 5

# ============================================
# YOUTUBE PLUGIN - SEARCH CONFIGURATION
# ============================================
plugins:
  youtube:
    enabled: true
    allowSearch: true               # CRITICAL!
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    
    # Use MUSIC client first for better search
    clients:
      - MUSIC                       # Best for search
      - WEB                         # Fallback
      - ANDROID_MUSIC              
      - ANDROID
      - TVHTML5_SIMPLY_EMBEDDED_PLAYER
    
    # Search configuration
    searchOptions:
      maxResults: 10                # Return up to 10 results
      searchType: "video"           # Search for videos
    
    # Cache for better performance
    cache:
      enabled: true
      directory: /tmp/youtube-cache
      maximumSize: 100
      expireAfterAccess: 10m
    
    # Request options
    requestOptions:
      retryOptions:
        maxAttempts: 3
        initialBackoff: 1s
        maxBackoff: 10s
        backoffMultiplier: 2.0

  # ============================================
  # LAVASRC - ENHANCED SEARCH
  # ============================================
  lavasrc:
    # IMPORTANT: Providers for search
    providers:
      - "ytsearch:%QUERY%"         # YouTube search
      - "ytsearch:\"%ISRC%\""      # ISRC search
    
    sources:
      spotify: true
      applemusic: true
      deezer: false
      yandexmusic: false
      flowerytts: false
      vkmusic: false
    
    spotify:
      countryCode: "ID"
      playlistLoadLimit: 5
      albumLoadLimit: 5
    
    applemusic:
      countryCode: "ID"
      mediaAPIToken: ""
      playlistLoadLimit: 5
      albumLoadLimit: 5
    
    # YouTube search via LavaSrc
    youtube:
      countryCode: "ID"
      language: "id"

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: DEBUG    # Debug YouTube untuk troubleshooting
