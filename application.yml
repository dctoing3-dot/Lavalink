server:
  port: ${PORT:-2333}
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.16.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    password: ${LAVALINK_PASSWORD:your_super_strong_password_here}
    
    sources:
      youtube: false        # MUST be false for plugin
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    
    # Audio quality settings
    bufferDurationMs: 400
    frameBufferDurationMs: 2000
    youtubePlaylistLoadLimit: 5
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    
    # Audio codec settings (FIX untuk tidak ada suara)
    audioCodecs:
      - opus
      - vorbis
      - aac
      - mp3
      - flac
    
    # Filter configuration
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true        # FIX untuk YouTube URLs
    allowDirectPlaylistIds: true
    
    # Process all YouTube URL formats
    clients:
      - MUSIC
      - WEB  
      - ANDROID_MUSIC
      - WEB_EMBEDDED_PLAYER          # Untuk embedded links
      - TVHTML5_SIMPLY_EMBEDDED_PLAYER
    
    # URL handling
    urlParsing:
      enabled: true
      parseShortUrls: true            # Support youtu.be
      parseMusicUrls: true            # Support music.youtube.com
    
    cache:
      enabled: true
      directory: /tmp/youtube-cache
      maximumSize: 100
      expireAfterAccess: 10m

  lavasrc:
    providers:
      - "ytsearch:%QUERY%"
      - "ytsearch:\"%ISRC%\""
    
    sources:
      spotify: true
      applemusic: true
      deezer: false
      yandexmusic: false
      flowerytts: false
      vkmusic: false
    
    spotify:
      countryCode: "ID"
      playlistLoadLimit: 5
      albumLoadLimit: 5
    
    applemusic:
      countryCode: "ID"
      mediaAPIToken: ""
      playlistLoadLimit: 5
      albumLoadLimit: 5

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: DEBUG      # Debug untuk YouTube issues
    com.sedmelluq.discord.lavaplayer: DEBUG  # Debug untuk audio issues
