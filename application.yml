server:
  port: ${PORT:-2333}
  address: 0.0.0.0

# ============================================
# LAVALINK PLUGINS - YOUTUBE & LAVASRC
# ============================================
lavalink:
  plugins:
    # YouTube Plugin (WAJIB untuk YouTube support di v4)
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.11.4"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    
    # LavaSrc Plugin (Spotify, Deezer, Apple Music, dll)
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.3.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    password: ${LAVALINK_PASSWORD:your_super_strong_password_here}
    sources:
      # Built-in sources
      youtube: false        # HARUS false, pakai plugin!
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    
    # Optimization untuk Render free tier
    bufferDurationMs: 400
    frameBufferDurationMs: 2000
    youtubePlaylistLoadLimit: 5
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    
    # Track stuck threshold
    trackStuckThresholdMs: 10000
    
    # Use seekGhosting
    useSeekGhosting: true
    
    # YouTube rotation check
    youtubeConfig:
      email: ""
      password: ""
    
    # Rate limit config
    ratelimit:
      ipBlocks: []
      excludedIps: []
      strategy: "RotateOnBan"
      searchTriggersFail: true
      retryLimit: 3

# ============================================
# PLUGIN CONFIGURATIONS
# ============================================
plugins:
  # YouTube Plugin Configuration
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    
    # Clients untuk fallback (penting!)
    clients:
      - MUSIC           # YouTube Music (recommended)
      - WEB             # YouTube Web
      - ANDROID_TESTSUITE  # Android client
      - TVHTML5EMBEDDED    # TV client (untuk age-restricted)
    
    # OAuth untuk menghindari rate limit (opsional)
    # oauth:
    #   enabled: false
    #   refreshToken: ""
  
  # LavaSrc Configuration (Spotify, Deezer, Apple Music)
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""   # Cari via ISRC code
      - "ytsearch:%QUERY%"      # Fallback ke YouTube search
    
    sources:
      spotify: true
      applemusic: true
      deezer: true
      yandexmusic: false
      flowerytts: false
      vkmusic: false
    
    # Spotify Configuration (Gratis, tanpa credentials)
    spotify:
      countryCode: "ID"
      playlistLoadLimit: 5
      albumLoadLimit: 5
      
      # Opsional - untuk menghindari rate limit
      # clientId: "your_spotify_client_id"
      # clientSecret: "your_spotify_client_secret"
    
    # Deezer Configuration
    deezer:
      countryCode: "ID"
      # masterDecryptionKey: ""  # Opsional untuk HQ audio
    
    # Apple Music Configuration
    applemusic:
      countryCode: "ID"
      mediaAPIToken: "your_apple_music_token_here_or_leave_empty"
      playlistLoadLimit: 5
      albumLoadLimit: 5
    
    # Yandex Music (jika mau aktifkan)
    # yandexmusic:
    #   accessToken: ""

# ============================================
# METRICS & MONITORING
# ============================================
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

# ============================================
# SENTRY (Error tracking - opsional)
# ============================================
sentry:
  dsn: ""
  environment: "production"
  tags:
    platform: "render"

# ============================================
# LOGGING
# ============================================
logging:
  level:
    root: INFO
    lavalink: INFO
    
  # Log file configuration
  file:
    path: ./logs/
    max-size: 10MB
    max-history: 3

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 3
      total-size-cap: 30MB
